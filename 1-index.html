<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ============ AUDIO ============ */
let AC=null,master,musicGain,sfxGain,muted=false,audioOK=false,musicStarted=false;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume().catch(()=>{}); return; }
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AC=new C();
    master=AC.createGain(); master.gain.value=muted?0:1; master.connect(AC.destination);
    musicGain=AC.createGain(); musicGain.gain.value=.16; musicGain.connect(master);
    sfxGain=AC.createGain(); sfxGain.gain.value=.5; sfxGain.connect(master);
    AC.resume().then(()=>{audioOK=AC.state==='running';if(audioOK){$('#hint').style.opacity=0;startMusic();}}).catch(()=>{});
    if(AC.state==='running'){audioOK=true;$('#hint').style.opacity=0;startMusic();}
  }catch(e){AC=null}
}
function noiseBuf(sec){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function tone(freq,t,dur,type='square',vol=.3,dest,slideTo){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+dur+.05);
}
function noise(t,dur,vol,type,freq,dest){
  const s=AC.createBufferSource();s.buffer=noiseBuf(Math.max(dur,.05));
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||sfxGain);s.start(t);s.stop(t+dur+.05);
}
const sfx={
  click(n=0){if(!audioOK)return;const t=AC.currentTime;tone(520+n*70,t,.09,'square',.22);tone(780+n*90,t+.05,.09,'square',.18)},
  dodge(){if(!audioOK)return;const t=AC.currentTime;tone(900,t,.12,'square',.14,null,300)},
  glitch(){if(!audioOK)return;const t=AC.currentTime;for(let i=0;i<7;i++){noise(t+i*.045,.04,.35,'bandpass',rnd(500,5000));tone(rnd(80,1600),t+i*.045,.04,'sawtooth',.12)}},
  glass(){if(!audioOK)return;const t=AC.currentTime;
    noise(t,.12,1,'highpass',1500);noise(t,.7,.7,'highpass',4500);
    tone(90,t,.5,'sine',.8,null,40);
    for(let i=0;i<26;i++){const tt=t+.02+Math.random()*.9;tone(rnd(2400,9000),tt,rnd(.04,.16),'triangle',rnd(.08,.2));noise(tt,.03,.25,'highpass',6000)}},
  thud(){if(!audioOK)return;const t=AC.currentTime;tone(120,t,.25,'sine',.7,null,40)},
  blip(){if(!audioOK)return;const t=AC.currentTime;tone(660,t,.07,'square',.2);tone(990,t+.06,.1,'square',.2)},
  flip(){if(!audioOK)return;const t=AC.currentTime;tone(200,t,.35,'sawtooth',.25,null,1200);noise(t,.2,.3,'bandpass',2500)},
  type(){if(!audioOK)return;const t=AC.currentTime;tone(rnd(1400,2000),t,.025,'square',.05)},
  wrong(){if(!audioOK)return;const t=AC.currentTime;tone(160,t,.2,'sawtooth',.2);tone(120,t+.12,.3,'sawtooth',.2)},
  fanfare(){if(!audioOK)return;const t=AC.currentTime;
    const seq=[[523,0,.12],[523,.14,.12],[523,.28,.12],[659,.42,.2],[523,.66,.12],[659,.8,.12],[784,.94,.55],[1047,1.55,.14],[988,1.72,.14],[1047,1.9,.14],[1319,2.08,.9]];
    seq.forEach(([f,d,l])=>{tone(f,t+d,l,'square',.28);tone(f/2,t+d,l,'triangle',.3);tone(f*1.5,t+d,l,'square',.08)});
    [0,.5,1.0,1.5,2.0].forEach(d=>{tone(100,t+d,.2,'sine',.8,null,45);noise(t+d+.25,.08,.25,'highpass',5000)});
    tone(1568,t+2.08,1,'square',.12);
  }
};
/* lofi generator */
const CH=[[57,60,64,67,71],[53,57,60,64,69],[48,52,55,59,64],[55,59,62,64,69]]; /* Am9 Fmaj9 Cmaj7 G6 */
const mtof=m=>440*Math.pow(2,(m-69)/12);
function startMusic(){
  if(musicStarted||!AC)return;musicStarted=true;
  const bpm=72,beat=60/bpm,bar=beat*4;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;lp.Q.value=.4;lp.connect(musicGain);
  /* tape wobble */
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.35;lg.gain.value=6;lfo.connect(lg);lfo.start();
  /* vinyl crackle */
  const cb=AC.createBuffer(1,AC.sampleRate*4,AC.sampleRate),cd=cb.getChannelData(0);
  for(let i=0;i<cd.length;i++)cd[i]=Math.random()<.0009?(Math.random()*2-1)*.9:(Math.random()*2-1)*.012;
  const cs=AC.createBufferSource();cs.buffer=cb;cs.loop=true;const cf=AC.createBiquadFilter();cf.type='highpass';cf.frequency.value=900;const cg=AC.createGain();cg.gain.value=.5;cs.connect(cf);cf.connect(cg);cg.connect(musicGain);cs.start();
  let next=AC.currentTime+.1,barN=0;
  const melo=[0,2,4,2,3,1,4,2,0,1,3,4];
  function pad(m,t,d){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='triangle';o2.type='sine';o.frequency.value=mtof(m);o2.frequency.value=mtof(m)*1.004;lg.connect(o.detune);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.5);g.gain.linearRampToValueAtTime(.06,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(g);o2.connect(g);g.connect(lp);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)}
  function pluck(m,t){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=mtof(m);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);o.connect(g);g.connect(lp);o.start(t);o.stop(t+1.2)}
  function sched(){
    if(!AC)return;
    while(next<AC.currentTime+2){
      const ch=CH[barN%4];
      ch.forEach((m,i)=>pad(m-(i===0?12:0),next+i*.02,bar*1.05));
      pluck(ch[0]-24,next);pluck(ch[0]-24,next+beat*2.5);
      for(let b=0;b<8;b++){
        const t=next+b*beat/2+(b%2?beat*.06:0);
        if(Math.random()<.55)pluck(ch[melo[(barN*3+b)%melo.length]%ch.length]+12,t);
        /* hats */
        noise(t,.04,b%2?.05:.09,'highpass',7000,musicGain);
      }
      /* kick + snare */
      [0,beat*2.5].forEach(d=>tone(110,next+d,.25,'sine',.5,musicGain,42));
      [beat,beat*3].forEach(d=>noise(next+d,.16,.18,'bandpass',1800,musicGain));
      next+=bar;barN++;
    }
  }
  sched();setInterval(sched,500);
}
/* unlock on first gesture; retry on every gesture until running */
['pointerdown','keydown','touchstart','click'].forEach(ev=>addEventListener(ev,()=>{if(!audioOK)initAudio();else if(AC&&AC.state==='suspended')AC.resume()},{passive:true}));
$('#mute').addEventListener('click',e=>{
  e.stopPropagation();initAudio();muted=!muted;if(master)master.gain.value=muted?0:1;$('#mute').textContent=muted?'🔇':'🔊';
  if(muted)try{speechSynthesis.cancel()}catch(_){}
});

/* ============ NARRATOR ============ */
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_](GB|IN)/i.test(x.lang)&&/male|daniel|google uk english male|rishi/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null}catch(_){}}
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(_){}
let capTimer;
function say(text,opts={}){
  const c=$('#cap');c.innerHTML='<b>NARRATOR</b>'+text;c.classList.add('on');clearTimeout(capTimer);capTimer=setTimeout(()=>c.classList.remove('on'),Math.max(3500,text.length*85));
  if(muted)return;
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.rate=opts.rate||.92;u.pitch=opts.pitch||.55;u.volume=1;if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-US';
    speechSynthesis.speak(u);
  }catch(_){}
}

/* ============ BACKGROUND (stars/dust) ============ */
const shards=[];
const bg=$('#bg'),bx=bg.getContext('2d');let W,H,dust=[];
function resize(){W=bg.width=innerWidth;H=bg.height=innerHeight;fx.width=W;fx.height=H;dust=Array.from({length:Math.min(90,W/12|0)},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.4,1.8),v:rnd(.05,.3),a:rnd(.15,.6)}))}
const fx=$('#fx'),fxc=fx.getContext('2d');
addEventListener('resize',resize);resize();
let mx=W/2,my=H/2;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY},{passive:true});
let tint='255,255,255';
(function loop(){
  bx.clearRect(0,0,W,H);
  const g=bx.createRadialGradient(mx,my,0,mx,my,Math.max(W,H)*.45);g.addColorStop(0,'rgba('+(tint==='255,255,255'?'80,80,110':tint)+',.16)');g.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=g;bx.fillRect(0,0,W,H);
  dust.forEach(d=>{d.y-=d.v;if(d.y<-5){d.y=H+5;d.x=rnd(0,W)}bx.fillStyle='rgba('+tint+','+d.a*.6+')';bx.beginPath();bx.arc(d.x,d.y,d.r,0,6.3);bx.fill()});
  /* shards */
  fxc.clearRect(0,0,W,H);
  for(let i=shards.length-1;i>=0;i--){const s=shards[i];s.vy+=.5;s.x+=s.vx;s.y+=s.vy;s.rot+=s.vr;if(s.y>H+80){shards.splice(i,1);continue}
    fxc.save();fxc.translate(s.x,s.y);fxc.rotate(s.rot);fxc.beginPath();fxc.moveTo(0,-s.s);fxc.lineTo(s.s*.8,s.s*.6);fxc.lineTo(-s.s*.7,s.s*.5);fxc.closePath();
    fxc.fillStyle='rgba(190,235,255,'+s.a+')';fxc.fill();fxc.strokeStyle='rgba(255,255,255,.9)';fxc.lineWidth=1;fxc.stroke();fxc.restore()}
  requestAnimationFrame(loop);
})();

/* ============ GAME ============ */
const btn=$('#dnc'),msg=$('#msg'),h1=$('#h1');
let clicks=0,dodgesLeft=0,broken=false,lastPT='mouse';
const setMsg=t=>{msg.innerHTML='<span>'+t+'</span>'};
const quips={2:"Why are you still clicking?",4:"You know that's a bad idea, right?",6:"Bold of you to keep chasing it.",7:"I'd stop. But I know you won't.",8:"Seriously? What is wrong with you?",9:"One more and something is going to snap."};

function dodge(){
  const r=btn.getBoundingClientRect();
  if(!btn.classList.contains('fly')){
    btn.classList.add('fly');btn.style.transition='none';btn.style.left=r.left+'px';btn.style.top=r.top+'px';btn.style.transform='translate(0,0)';
    void btn.offsetWidth;
  }
  const bw=r.width,bh=r.height,pad=14;
  let nx,ny,tries=0;const cx=r.left+bw/2,cy=r.top+bh/2;
  do{nx=rnd(pad,innerWidth-bw-pad);ny=rnd(70,innerHeight-bh-90);tries++}while(tries<20&&Math.hypot(nx+bw/2-cx,ny+bh/2-cy)<Math.min(innerWidth,innerHeight)*.3);
  btn.style.transition='transform .16s cubic-bezier(.2,1.5,.4,1)';
  btn.style.transform='translate('+(nx-parseFloat(btn.style.left))+'px,'+(ny-parseFloat(btn.style.top))+'px) rotate('+rnd(-14,14)+'deg)';
  dodgesLeft--;sfx.dodge();
}
btn.addEventListener('pointerenter',e=>{lastPT=e.pointerType;if(e.pointerType==='mouse'&&clicks>=5&&dodgesLeft>0&&!broken)dodge()});
btn.addEventListener('pointerdown',e=>{lastPT=e.pointerType;btn.classList.add('press')});
['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>btn.classList.remove('press')));
btn.addEventListener('click',e=>{
  if(broken)return;
  if(clicks>=5&&dodgesLeft>0){ /* touch / keyboard attempt: dodge first */ dodge();return }
  clicks++;sfx.click(clicks%6);
  if(clicks===1)setMsg("Seriously, stop.");
  else if(clicks===3)setMsg("I'm warning you, nothing is behind this.");
  else if(clicks===5)setMsg("The button is dodging you now!");
  if(quips[clicks])say(quips[clicks]);
  if(clicks===1)say("Why are you still clicking?");
  if(clicks===3)say("I'm warning you. There is nothing behind that button.");
  if(clicks===5){say("The button is dodging you now. Try and catch it.");}
  if(clicks>=5&&clicks<10)dodgesLeft=clicks===5?4:3;
  if(clicks>=5&&clicks<10)setTimeout(()=>{if(dodgesLeft>0&&!broken)dodge()},350); /* it jumps away right after the click */
  if(clicks<5){h1.classList.add('glitch');sfx.glitch();setTimeout(()=>h1.classList.remove('glitch'),180+clicks*50)}
  if(clicks===10)breakSystem(e);
});

function crack(cx,cy){
  const svg=$('#cracks');svg.innerHTML='';svg.setAttribute('viewBox','0 0 '+innerWidth+' '+innerHeight);
  const NS='http://www.w3.org/2000/svg';
  function branch(x,y,ang,len,w,depth){
    const pts=[[x,y]];let steps=Math.floor(len/28);
    for(let i=0;i<steps;i++){ang+=rnd(-.35,.35);x+=Math.cos(ang)*rnd(18,34);y+=Math.sin(ang)*rnd(18,34);pts.push([x,y]);
      if(depth<3&&Math.random()<.22)branch(x,y,ang+rnd(-1.2,1.2),len*rnd(.3,.6),w*.6,depth+1)}
    const p=document.createElementNS(NS,'path');p.setAttribute('d','M'+pts.map(q=>q.join(',')).join(' L'));p.style.strokeWidth=w;
    const L=pts.length*45;p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.style.transition='stroke-dashoffset '+(.25+depth*.2)+'s ease-out '+(depth*.07)+'s';svg.appendChild(p);
    requestAnimationFrame(()=>requestAnimationFrame(()=>p.style.strokeDashoffset=0));
  }
  const n=16;for(let i=0;i<n;i++)branch(cx,cy,(i/n)*6.283+rnd(-.2,.2),rnd(Math.max(innerWidth,innerHeight)*.25,Math.max(innerWidth,innerHeight)*.7),rnd(1.4,3),0);
  /* rings */
  for(let k=1;k<=3;k++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',k*55+rnd(-8,8));c.style.cssText='fill:none;stroke:rgba(255,255,255,.35);stroke-width:1;stroke-dasharray:'+rnd(60,200)+' '+rnd(30,90);svg.appendChild(c)}
}
function burstShards(cx,cy){for(let i=0;i<90;i++){const a=rnd(0,6.283),sp=rnd(3,17);shards.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,vr:rnd(-.3,.3),rot:rnd(0,6),s:rnd(5,22),a:rnd(.4,.9)})}}

function breakSystem(e){
  broken=true;dodgesLeft=0;
  const br=btn.getBoundingClientRect();const cx=br.left+br.width/2,cy=br.top+br.height/2;
  document.body.classList.add('shake','cracked');
  const fl=$('#flash');fl.style.transition='none';fl.style.opacity=.9;requestAnimationFrame(()=>{fl.style.transition='opacity .7s';fl.style.opacity=0});
  sfx.glass();setTimeout(sfx.glitch,200);
  crack(cx,cy);burstShards(cx,cy);setTimeout(()=>burstShards(innerWidth*rnd(.2,.8),innerHeight*rnd(.2,.5)),180);
  btn.style.transition='transform .3s,opacity .3s';btn.style.opacity=0;btn.style.pointerEvents='none';setTimeout(()=>{btn.classList.remove('fly');btn.style.cssText='';$('#btnWrap').classList.add('out')},350);
  setMsg('');msg.style.opacity=0;
  h1.classList.add('glitch');setTimeout(()=>h1.classList.remove('glitch'),1400);
  setTimeout(()=>document.body.classList.remove('shake'),800);
  setTimeout(fallNO,550);
  say("Great... you shattered the title. Are you happy now? I guess you might as well flip that glowing switch.",{rate:.9});
}
function fallNO(){
  const no=$('#no'),r=no.getBoundingClientRect(),cs=getComputedStyle(no);
  const el=document.createElement('div');el.className='fall';el.textContent='NO';
  el.style.cssText+=`left:${r.left}px;top:${r.top}px;font-size:${cs.fontSize};font-family:${cs.fontFamily};width:${r.width}px;height:${r.height}px;line-height:${r.height}px`;
  document.body.appendChild(el);no.classList.add('gone');
  $('#sub').classList.add('room');
  const footH=document.querySelector('footer').offsetHeight;
  let y=0,vy=0,x=0,vx=rnd(-1.5,1.5),rot=0,vr=rnd(-.03,.03),bounces=0;
  const floor=()=>innerHeight-footH-r.height-14-r.top;
  (function step(){
    vy+=.9;y+=vy;x+=vx;rot+=vr;const f=floor();
    if(y>=f){y=f;if(Math.abs(vy)>4&&bounces<4){vy*=-.38;vx*=.6;vr*=.5;bounces++;sfx.thud();document.body.classList.remove('shake')}else{vy=0;vx=0;vr=0;el.style.transform=`translate(${x}px,${y}px) rotate(${rot}rad)`;sfx.thud();return finishFall()}}
    el.style.transform=`translate(${x}px,${y}px) rotate(${rot}rad)`;requestAnimationFrame(step);
  })();
  function finishFall(){
    setTimeout(()=>{$('#override').classList.add('on');sfx.blip();tint='57,255,122'},700);
  }
}
/* switch */
const sw=$('#sw');let swDone=false;
sw.addEventListener('click',async()=>{
  if(swDone)return;swDone=true;sw.classList.add('flip');sfx.flip();try{speechSynthesis.cancel()}catch(_){}
  document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),500);sfx.glitch();
  await sleep(900);openTerm();
});

/* ============ TERMINAL ============ */
const tb=$('#tbody');
async function typeIn(el,text,speed=24){for(const ch of text){el.textContent+=ch;if(ch!==' ')sfx.type();await sleep(speed)}}
function ask(q,opts){
  return new Promise(async res=>{
    const d=document.createElement('div');d.className='tq';tb.appendChild(d);
    const caret=document.createElement('span');caret.className='caret';
    await typeIn(d,'> '+q,28);d.appendChild(caret);
    const o=document.createElement('div');o.className='opts';
    opts.forEach((t,i)=>{const b=document.createElement('button');b.textContent='[ '+t+' ]';b.style.animationDelay=i*.15+'s';
      b.onclick=()=>{sfx.click(i+2);o.querySelectorAll('button').forEach(x=>x.disabled=true);o.remove();caret.remove();d.textContent+='  '+t;res(i)};o.appendChild(b)});
    tb.appendChild(o);
  });
}
async function line(t,speed=18){const d=document.createElement('div');d.className='tline';tb.appendChild(d);await typeIn(d,t,speed)}
async function openTerm(){
  $('#termBack').classList.add('on');tb.innerHTML='';
  await sleep(500);
  await line('booting override protocol...',16);await sleep(150);
  await line('identity check required.',16);await sleep(250);
  const a1=await ask('Are you Jeeshant?',['Yes','No']);
  if(a1===1){sfx.wrong();await line('\n  lies detected. continuing anyway...',16);await sleep(500)}else{await line('\n  access granted... probably.',16);await sleep(400)}
  const a2=await ask('Are you a friend of Abhinash?',['Yes','Nahi, woh mera papa hai!']);
  if(a2===1){await line('\n  ...wait, WHAT?',16);await sleep(350)}else await line('\n  suspicious. very suspicious.',16);
  await sleep(300);await line('\n  overriding...  [##########] 100%',14);await sleep(700);
  $('#termBack').classList.remove('on');await sleep(500);finale();
}

/* ============ FINALE ============ */
function boom(){
  const d={zIndex:200,disableForReducedMotion:false};
  confetti({...d,particleCount:200,spread:110,origin:{x:.5,y:.6},startVelocity:55});
  confetti({...d,particleCount:120,angle:60,spread:70,origin:{x:0,y:.7},startVelocity:60});
  confetti({...d,particleCount:120,angle:120,spread:70,origin:{x:1,y:.7},startVelocity:60});
}
async function finale(){
  tint='255,209,92';sfx.fanfare();const ck=document.getElementById('cracks');ck.style.transition='opacity 2s';ck.style.opacity=.18;.style.transition='opacity 2s';.style.opacity=.18;
  const end=Date.now()+3500;boom();
  const iv=setInterval(()=>{if(Date.now()>end)return clearInterval(iv);
    confetti({zIndex:200,particleCount:30,startVelocity:35,spread:360,ticks:90,origin:{x:Math.random(),y:Math.random()*.4},colors:['#ffd15c','#38f5ff','#ff2d95','#39ff7a','#ffffff']})},220);
  setTimeout(boom,900);setTimeout(boom,1900);
  const f=$('#finale');
  const mk=(c,t)=>{const d=document.createElement('div');d.className='card '+c;d.textContent=t;f.appendChild(d);return d};
  const c1=mk('c1','OKAY FINE, you can access the website. I am Abhinash, the father of this website!');
  f.scrollIntoView({behavior:'smooth',block:'center'});
  await sleep(100);c1.classList.add('show');
  say("Okay fine. You win.",{rate:.95});
  await sleep(3000);
  const c2=mk('c2','Thank you so much for the awesome gift! You are my absolute best friend.');
  requestAnimationFrame(()=>c2.classList.add('show'));sfx.blip();
  c2.scrollIntoView({behavior:'smooth',block:'center'});
  confetti({zIndex:200,particleCount:90,spread:90,origin:{y:.7},colors:['#38f5ff','#ffffff']});
  await sleep(2000);
  const c3=mk('c3','chal! Chal! Itte paise mai itta hi tamasha milega!');
  requestAnimationFrame(()=>c3.classList.add('show'));sfx.thud();sfx.glitch();
  document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),600);
  c3.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{confetti({zIndex:200,particleCount:160,spread:130,origin:{y:.6},colors:['#ff2d95','#ff7a18','#ffd15c']});},500);
  window.__done=true;
}
window.__dbg={get clicks(){return clicks}};
})();
</script>
